<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>メモ一覧</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css">

    <style>
        .search-container {
            margin-bottom: 2rem;
            background: var(--color-white);
            padding: 1.25rem;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }
        .search-form {
            display: flex;
            gap: 0.75rem;
        }
        .search-input-wrapper {
            flex-grow: 1;
            position: relative;
        }
        .search-icon {
            position: absolute;
            left: 0.75rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--color-text-light);
            pointer-events: none;
        }
        .search-input {
            width: 100%;
            padding: 0.6rem 0.75rem 0.6rem 2.25rem;
            border: 1px solid var(--color-border);
            border-radius: var(--radius);
            font-size: 0.95rem;
        }
        .btn-search-submit {
            min-width: 100px
        }

        .btn-reset {
            background: var(--color-border);
            color: var(--color-text);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            padding: 0.6rem 1rem;
            border-radius: var(--radius);
            font-size: 0.9rem;
            transition: opacity 0.2s;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1 class="app-title">メモ一覧</h1>
            <a th:href="@{/memo/new}" class="btn btn-primary">
                <i class="ri-add-circle-line"></i> 新規メモ
            </a>
        </div>

        <div class= "seearch-contaoner">
            <form th:action="@{/memo/search}" method="get" class="search-form">
                <div class="ri-search-iput-wrapper">
                    <i class="ri-search-line search-icon"></i>
                    <input type="text" name="keyword" th:value="${keyword}"
                    class="search-input" placeholder="タイトルまたは内容で検索…">
                </div>
                <button type="submit" class="btn btn-primary btn-search-submit">検索</button>
                <a th:href="@{/memo}" class="btn-reset">リセット</a>
            </form>
        </div>

        <div class="notes-grid">
            <div class="note-card" th:each="memo : ${memos}">
                <div class="note-card-header">
                    <h3 class="note-card-title" th:text="${memo.title}">タイトル</h3>
                    <span th:if="${memo.priority != null}"
                          th:text="${memo.priority.label}"
                          th:class="|note-badge ${memo.priority.name().toLowerCase() == 'middle' ? 'medium' : memo.priority.name().toLowerCase()}|"></span>
                </div>
                <div class="note-card-content">
                    <p class="note-card-text" th:text="${memo.content}">内容</p>
                </div>
                <div class="note-card-footer">
                    <p class="note-date" th:text="${#temporals.format(memo.createdAt, 'yyyy/MM/dd HH:mm')}">日付</p>
                    <div class="note-actions">
                        <a th:href="@{|/memo/detail/${memo.id}|}" class="btn btn-primary">詳細</a>
                        <a th:href="@{|/memo/delete/${memo.id}|}" class="btn btn-danger">
                            削除
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <div th:if="${memos.isEmpty()}" class="empty-state">
            <p>メモがありません</p>
            <a th:href="@{/memo/new}" class="btn btn-primary">新しいメモを作成</a>
        </div>
    </div>
    <script th:src="@{/js/common.js}"></script>
</body>

</html>
